<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TaskFlow — sign in to manage your tasks" />
  <title>TaskFlow — Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">

  <main class="auth-card" role="main">
    <div class="auth-logo" aria-hidden="true">✦</div>
    <h1 class="auth-title">TaskFlow</h1>
    <p class="auth-subtitle">Sign in to your workspace</p>

    <form id="login-form" class="auth-form" novalidate>

      <div class="form-group">
        <label for="login-email">Email address</label>

        <input id="login-email" type="email" data-testid="email-input" placeholder="admin@taskflow.io"
          autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" data-testid="password-input" placeholder="Enter your password"
          autocomplete="current-password" required />
      </div>

      <div id="login-error" class="form-error" role="alert" aria-live="polite" hidden data-testid="login-error"></div>

      <button id="login-submit" type="submit" data-testid="submit-btn">
        Sign in
      </button>
    </form>

    <p class="auth-hint">Demo credentials: <code>admin@taskflow.io</code> / <code>password123</code></p>
  </main>

  <script src="app.js"></script>
</body>

</html>
